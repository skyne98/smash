[package]
name = "smash-ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
smash-js = { path = "../js" }
serde = { workspace = true }
serde_json = { workspace = true }
smash-core = { workspace = true }
smash-client = { workspace = true }
smash-backend = { workspace = true }
smash-ext = { workspace = true }
smash-session = { workspace = true }
smash-ai = { path = "../ai" }
tokio = { version = "1", features = ["rt-multi-thread"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-width = "0.2"
pulldown-cmark = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
